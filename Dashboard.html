<link rel="stylesheet" href="Dashboard.css">
<link rel="stylesheet" href="all.css">
<link rel="stylesheet" href="all.min.css">
<section class="Dashboard">
    <div class="main">
        <div class="advice-Bar">
            <h2> Good morning , khalil </h2>
            <p>Device</p>
        </div>
        <div class="info-bar">
            <div class="card">
                <div id="container" class="icon-wrapper"> <i class="fa-solid fa-check" style=" font-size: 30px; color: #5b3fd6;"></i></div>
                <div class="info">
                    <h4>Total tasks</h4>
                    <p>7</p>
                    <p>3 completed</p>
                </div>
                <button>></button>
                
            </div>
            <div class="card">
                <div class="icon-wrapper"> <i class="fa-regular fa-clock"  style="font-size: 30px; color: #5b3fd6;"></i></div>
                <div class="info">
                    <h4>Study Time</h4>
                    <p>2h 15m</p>
                    <p>today</p>
                </div>
                <button>></button>
            </div>
            <div class="card">
                <div class="icon-wrapper">  <i class="fa-solid fa-chart-simple"  style=" font-size: 30px; color: #5b3fd6;"></i></div>
                <div class="info">
                    <h4>Progress</h4>
                    <p>57%</p>
                    <p>this week</p>
                </div>
                <button>&gt;</button>
            </div>
        </div>
        <div class="middle-row">
            <div class="task-column">
                <div class="title">
                <i class="fa-solid fa-list-check"></i>
                <h3>Today's tasks</h3>
                </div>
                <div class="tasks">
                    <label> <input type="checkbox">kfkfkfkfkfk</label>

                </div>
                <div class="add-tasks">
                    <button class="add">+</button>
                    <p>add Tasks</p>
                    <input type="text" placeholder="add the Tasks">
                </div>
            </div>
            <div class="side-column">
                <div class="quick-timer">.</div>
                <div class="weather">.</div>
            </div> 
        </div>
    </div>        

</section>
